[project]
name = "public"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedgenerator",
    "gymnasium[other]>=1.2.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.4.10",
    "jupytext>=1.18.1",
    "markdown>=3.4",
    "markdown-inline-mermaid==1.0.4",
    "markdown-obsidian-callouts",
    "markupsafe==2.0.1",
    "mlx>=0.29.3",
    "mlx-image>=0.1.7",
    "nbconvert==7.2.5",
    "pelican==4.12.0",
    "pelican-frontmark",
    "pelican-jupyter",
    "pelican-katex==1.6.1",
    "prometheus-client>=0.23.1",
    "pybtex==0.26.1",
    "pydicom>=3.0.1",
    "pygments==2.21.0",
    "scikit-learn>=1.7.2",
    "pelican-alias>=1.1",
    "mcp>=2,<3",
]

[tool.uv]
# Pelican 4.12.0 caps Pygments below 2.20. Pin the tested version to use its
# plugin-discovery cache; remove this override when Pelican raises the cap.
override-dependencies = ["pygments==2.21.0"]

[tool.uv.sources]
feedgenerator = { git = "https://github.com/lextoumbourou/feedgenerator.git" }
pelican-frontmark = { git = "https://github.com/lextoumbourou/pelican-frontmark.git" }
pelican-jupyter = { git = "https://github.com/lextoumbourou/pelican-jupyter.git" }
markdown-obsidian-callouts = { git = "https://github.com/lextoumbourou/markdown-obsidian-callouts.git" }

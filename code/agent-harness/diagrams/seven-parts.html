<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Seven parts of an agent harness</title>
<style>
@font-face {
  font-family: Shantell;
  src: url(../../../theme/static/fonts/shantell-sans-latin-wght-normal.woff2);
  font-weight: 300 800;
}
html, body { margin: 0; background: #FBFAF6; }
svg { display: block; }
.label, .part {
  font-family: Shantell, cursive;
  font-weight: 800;
  fill: #141414;
  text-anchor: middle;
  dominant-baseline: middle;
}
.label { font-size: 76px; }
.part { font-size: 55px; }
.detail { font-size: 38px; }
.arrow { fill: none; stroke: #141414; stroke-width: 18; stroke-linecap: butt; }
.link { fill: none; stroke: #5C5B57; stroke-width: 7; stroke-dasharray: 16 15; }
</style>
<svg id="d" width="1920" height="1160" viewBox="0 100 1920 1160" role="img" aria-labelledby="title description" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Seven parts of an agent harness</title>
  <desc id="description">A central agent loop passes through context, model, tools and result. A context management strategy feeds context; LLM integration connects to the model; safety controls, including sandboxing, guard tools; extension surfaces add capabilities; orchestration coordinates the loop.</desc>
  <rect width="1920" height="1260" fill="#FBFAF6"/>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.5" markerHeight="2.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10Z" fill="#141414"/>
    </marker>
  </defs>

  <!-- Dotted links show which part of the loop each surrounding system affects. -->
  <path class="link" d="M590 224 Q680 222 772 274"/>
  <path class="link" d="M1540 274 Q1560 360 1500 486"/>
  <path class="link" d="M1590 890 Q1470 840 1375 678"/>
  <path class="link" d="M500 914 Q620 965 775 890"/>
  <path class="link" d="M960 1088 Q1210 1060 1200 950 Q1190 790 1125 650"/>

  <!-- The four steps of the agent loop. -->
  <path class="arrow" d="M1190 355 L1350 480" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M1370 650 L1190 790" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M730 790 L570 650" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M570 480 L730 355" marker-end="url(#arrowhead)"/>

  <g transform="rotate(-1.5 960 300)"><rect x="760" y="240" width="400" height="120" fill="#A9D6FF"/></g>
  <text class="label" x="960" y="300">context</text>

  <g transform="rotate(1.5 1500 560)"><rect x="1300" y="500" width="400" height="120" fill="#FF6FAE"/></g>
  <text class="label" x="1500" y="560">model</text>

  <g transform="rotate(-1 960 880)"><rect x="760" y="820" width="400" height="120" fill="#FFE84D"/></g>
  <text class="label" x="960" y="880">tools</text>

  <g transform="rotate(1 420 560)"><rect x="220" y="500" width="400" height="120" fill="#2DD4BF"/></g>
  <text class="label" x="420" y="560">result</text>

  <text class="part" x="960" y="570">agent loop</text>

  <!-- The other five subsystems surround and modify that loop. -->
  <g transform="rotate(-1.5 360 215)"><rect x="110" y="140" width="500" height="150" fill="#CFE8FF"/></g>
  <text class="part" x="360" y="169">context</text>
  <text class="part" x="360" y="215">management</text>
  <text class="part" x="360" y="261">strategy</text>

  <g transform="rotate(1.5 1540 215)"><rect x="1300" y="140" width="480" height="150" fill="#FFC5DF"/></g>
  <text class="part" x="1540" y="189">LLM</text>
  <text class="part" x="1540" y="245">integration</text>

  <g transform="rotate(1 1660 955)"><rect x="1450" y="870" width="420" height="175" fill="#FFB866"/></g>
  <text class="part" x="1660" y="914">safety</text>
  <text class="part" x="1660" y="963">controls</text>
  <text class="part detail" x="1660" y="1010">sandboxing</text>

  <g transform="rotate(-1 270 955)"><rect x="50" y="880" width="440" height="150" fill="#BDEB7A"/></g>
  <text class="part" x="270" y="929">extension</text>
  <text class="part" x="270" y="985">surfaces</text>

  <g transform="rotate(1 960 1158)"><rect x="720" y="1080" width="480" height="155" fill="#C4B2FF"/></g>
  <text class="part" x="960" y="1158">orchestration</text>
</svg>
<script>document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });</script>
</html>

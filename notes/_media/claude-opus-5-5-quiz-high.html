[-1,1].forEach(s=>{box(B,s*.3,.62,0,.22,.62,.24,[40,40,100]);box(B,s*.3,.08,.08,.24,.08,.32,[25,25,30]);

box(B,0,1.8,0,.66,.6,.36,[220,40,60]);box(B,0,1.85,.37,.16,.52,.02,[245,245,245]);box(B,0,2.3,.4,.24,.08,.03,[255,210,0],{e:1});

flash(evOk?'#3f6':'#f33');[...ans.children].forEach((b,i)=>b.classList.add(i==cor?'ok':i==k?'no':'gone'));$('sc').textContent='★ '+score;
fbx.className='panel '+(evOk?'good':'bad');fbx.hidden=false;
fbx.innerHTML=`<h2>${evOk?'CORRECT!':'WHOOPS!'}</h2><p>${Q[qi].x}</p><button class="b nx" id="nx">${qi<Q.length-1?'NEXT ▶':'RESULTS ▶'}</button>`;
$('nx').onclick=()=>act(next);$('nx').focus({preventScroll:true})}
function next(){if(++qi<Q.length)render();else end()}
function start(){qi=0;score=0;$('sc').textContent='★ 0';render()}
function end(){mode='end';$('qn').textContent='RESULTS';const n=Q.length,r=score==n?'SUPERSTAR!':score>=6?'GREAT RUN!':score>=4?'NOT BAD!':'KEEP PRACTICING!';
menu(`<div class="logo" style="font-size:clamp(32px,8vw,60px)">${r}</div><p class="big">${'★'.repeat(score)}<span style="opacity:.3">${'★'.repeat(n-score)}</span></p><p class="sub">You scored ${score} out of ${n} on Claude Opus 5.5. ${score==n?'Flawless! You know your context windows from your cache reads.':'Play again to collect every star.'}</p>`,'PLAY AGAIN',start);
if(score>=n/2){confetti();beep([392,523,659,784,1047],.1)}else beep([392,330,262],.15,'triangle')}
function title(){mode='title';$('qn').textContent='READY?';
menu(`<div class="logo">OPUS 5.5<small>QUIZ SHOW 64</small></div><p class="sub">${Q.length} questions about Anthropic's Claude Opus 5.5. Pick the right podium and collect stars!</p><p class="tip">Keyboard: 1-4 or A-D to answer, arrows + Enter to choose, M toggles sound. Phone: just tap.</p><p class="blink">PRESS START</p>`,'START',start)}
function toggleSound(){snd=!snd;$('snd').textContent='♪ '+(snd?'ON':'OFF')}
ans.onclick=e=>{const b=e.target.closest('[data-k]');if(b)act(()=>answer(+b.dataset.k))};
ans.addEventListener('focusin',e=>{const b=e.target.closest('[data-k]');if(b){sel=+b.dataset.k;hi()}});
$('snd').onclick=toggleSound;
addEventListener('pointerdown',()=>{kb=false;hi()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k=='m')return toggleSound();if(k=='tab'){kb=true;return}
let n='1234'.indexOf(k);if(n<0)n='abcd'.indexOf(k);
if(mode=='q'){if(n>=0&&k.length==1){e.preventDefault();kb=true;return act(()=>answer(n))}
const m={arrowleft:-1,arrowright:1,arrowup:-2,arrowdown:2}[k];
if(m){e.preventDefault();kb=true;sel=(sel+m+4)%4;ans.children[sel].focus({preventScroll:true});hi();beep([440],.03);return}
if(k=='enter'||k==' '){e.preventDefault();kb=true;act(()=>answer(sel))}}
else if(k=='enter'||k==' '){e.preventDefault();kb=true;act(mode=='fb'?next:start)}});
addEventListener('resize',size);size();title();requestAnimationFrame(frame);
</script>
</body>
</html>
